<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Shower – Varsha & Nagendra</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--top:#e9e2f7;--bot:#fde8ea;--ink:#5b4a58;--soft:#8a7886;--card:#fffdfb;
--pink:#f7c6d1;--mint:#c9e8d8;--lav:#d9cdf1;--butter:#fbe9b0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--top:#3a2f4d;--bot:#4a3340;--ink:#f6ecf1;--soft:#cdbcc8;--card:#41354b}}
:root[data-theme="dark"]{--top:#3a2f4d;--bot:#4a3340;--ink:#f6ecf1;--soft:#cdbcc8;--card:#41354b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Nunito,system-ui,sans-serif;background:linear-gradient(var(--top),var(--bot)) fixed;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:12px}
main{max-width:520px;margin:0 auto;padding:22px 16px 50px;text-align:center}
h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:2.5rem;line-height:1.05;margin:6px 0 0}
h1 em{font-weight:400}
.lead{color:var(--soft);margin:8px 0 0}
.venue{text-decoration:none;color:inherit;display:inline-block;margin:12px 0 0;padding:8px 16px;border-radius:999px;background:var(--card);font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:transform .2s}
.venue:hover{transform:translateY(-2px)}

/* mobile */
.mobile{position:relative;height:270px;margin-top:6px}
.rod{position:absolute;left:4%;right:4%;top:0;height:14px;background:var(--butter);border-radius:9px;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.rod:before{content:"";position:absolute;left:50%;top:-40px;width:2px;height:40px;background:var(--soft);opacity:.5}
.charms{position:absolute;inset:14px 4% 0;display:flex;justify-content:space-between}
.hang{width:24%;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:sway 5s ease-in-out infinite}
.hang:nth-child(2){animation-delay:-1.2s}.hang:nth-child(3){animation-delay:-2.4s}.hang:nth-child(4){animation-delay:-3.6s}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.hang i{width:2px;background:var(--soft);opacity:.5}
.hang:nth-child(1) i{height:50px}.hang:nth-child(2) i{height:96px}.hang:nth-child(3) i{height:60px}.hang:nth-child(4) i{height:110px}
.charm{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:2.1rem;transition:transform .2s,box-shadow .3s;box-shadow:0 6px 14px rgba(0,0,0,.14)}
.charm:hover{transform:scale(1.08)}
.charm.on{box-shadow:0 0 0 5px var(--card),0 0 26px 8px var(--glow,#fff8)}
.charm .lb{position:absolute;margin-top:88px;font-size:.78rem;color:var(--soft)}
.hang{position:relative}
.c1{background:var(--butter);--glow:#fbe9b0}.c2{background:var(--pink);--glow:#f7c6d1}.c3{background:var(--lav);--glow:#d9cdf1}.c4{background:var(--mint);--glow:#c9e8d8}
.lb{pointer-events:none}

/* wind key */
.wind{display:inline-flex;align-items:center;gap:10px;background:var(--card);padding:11px 20px;border-radius:999px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.12);margin:4px 0 20px}
.key{display:inline-block;transition:transform .8s}
.wind.playing .key{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* panel */
.panel{background:var(--card);border-radius:26px;padding:24px 20px;min-height:190px;box-shadow:0 14px 34px rgba(120,90,130,.2);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.panel.swap{animation:swap .45s ease-out}
@keyframes swap{from{opacity:0;transform:translateY(14px)}}
.big{font-family:Fraunces,Georgia,serif;font-size:2.3rem;line-height:1.1;margin:0}
.small{color:var(--soft);margin:0}
.cd{display:flex;gap:8px;margin-top:6px}
.cd div{background:var(--butter);color:#6b5a2a;border-radius:12px;width:60px;padding:7px 0;font-size:.72rem}
.cd b{display:block;font-family:Fraunces,serif;font-size:1.35rem}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{padding:10px 16px;border-radius:999px;font-weight:700;background:var(--pink);color:#7a3d4f}
.pill.b{background:#d4e6f6;color:#37566f}
.pill[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
input{width:100%;padding:13px 16px;border-radius:999px;border:2px solid var(--lav);background:transparent;color:var(--ink);font:inherit;text-align:center}
.go{text-decoration:none;display:inline-block;padding:13px 22px;border-radius:999px;background:var(--pink);color:#7a3d4f;font-weight:700}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
.dots span{width:9px;height:9px;border-radius:50%;background:var(--soft);opacity:.3;transition:.3s}
.dots span.f{opacity:1;background:#e79bb0;transform:scale(1.25)}

.spark{position:fixed;pointer-events:none;z-index:50;font-size:18px;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.4) rotate(var(--r));opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ink);color:var(--top);padding:12px 20px;border-radius:999px;transition:transform .35s;z-index:60;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.theme{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:0 3px 10px rgba(0,0,0,.12);z-index:40}
@media (max-width:400px){.charm{width:64px;height:64px;font-size:1.7rem}h1{font-size:2.1rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button class="theme" onclick="theme()" aria-label="Switch light or dark theme">🌙</button>
<main>
  <div class="mobile">
    <div class="rod"></div>
    <div class="charms">
      <div class="hang"><i></i><button class="charm c1" data-i="0" aria-label="Moon: date">🌙<span class="lb">Date</span></button></div>
      <div class="hang"><i></i><button class="charm c2" data-i="1" aria-label="Star: time">⭐<span class="lb">Time</span></button></div>
      <div class="hang"><i></i><button class="charm c3" data-i="2" aria-label="Cloud: guess">☁️<span class="lb">Guess</span></button></div>
      <div class="hang"><i></i><button class="charm c4" data-i="3" aria-label="Heart: venue">💗<span class="lb">Venue</span></button></div>
    </div>
  </div>

  <h1>Varsha <em>&amp;</em> Nagendra</h1>
  <p class="lead">are expecting, and you're invited to their baby shower</p>
  <a class="venue" href="https://www.google.com/maps/search/?api=1&amp;query=Royal+Court+Madurai" target="_blank" rel="noopener" onclick="sparkle(this,10)" aria-label="Open Royal Court, Madurai in Google Maps">📍 Royal Court, Madurai · Open map</a>

  <div style="margin-top:18px">
    <button class="wind" id="wind" onclick="wind()"><span class="key">🗝️</span><span id="windTxt">Wind the music box</span></button>
  </div>

  <section class="panel" id="panel" aria-live="polite">
    <p class="big">Tap a charm</p>
    <p class="small">Each one holds a piece of the invitation, and plays a note.</p>
  </section>
  <div class="dots" id="dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
var target = new Date(2026, 9, 25, 10, 30, 0);
var freqs = [523.25, 659.25, 783.99, 880];
var found = [false,false,false,false], ctx, playing = false, cdTimer, tt, guessVal = '', guestName = '';
// Host's WhatsApp number with country code and no + or spaces, e.g. 919876543210. Leave empty to let the guest pick the chat.
var HOST_WHATSAPP = '';
var $ = function(id){ return document.getElementById(id); };

function note(i){
  try{
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === 'suspended') ctx.resume();
    var t = ctx.currentTime;
    [[1,.22],[2.76,.05],[5.4,.02]].forEach(function(p){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freqs[i]*p[0];
      g.gain.setValueAtTime(p[1], t); g.gain.exponentialRampToValueAtTime(.0001, t + 1.6/p[0]**.3);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 1.8);
    });
  }catch(e){}
}
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove('on')},2600); }
function sparkle(el, n){
  var r = el.getBoundingClientRect(), g = ['✦','✧','⭐','💗','✨'];
  for(var k=0;k<(n||10);k++){
    var s = document.createElement('i'); s.className='spark'; s.textContent = g[k%g.length];
    s.style.left = (r.left+r.width/2)+'px'; s.style.top = (r.top+r.height/2)+'px';
    s.style.setProperty('--x',(Math.random()*200-100)+'px'); s.style.setProperty('--y',(Math.random()*180-40)+'px'); s.style.setProperty('--r',(Math.random()*360-180)+'deg');
    document.body.appendChild(s); setTimeout(function(e){e.remove()}.bind(null,s),1200);
  }
}
function swing(i){
  var h = document.querySelectorAll('.hang')[i];
  h.animate([{transform:'rotate(0)'},{transform:'rotate(-22deg)'},{transform:'rotate(16deg)'},{transform:'rotate(-8deg)'},{transform:'rotate(0)'}],{duration:1400,easing:'ease-out'});
  var c = h.querySelector('.charm'); c.classList.add('on'); setTimeout(function(){c.classList.remove('on')},900);
}

var views = [
  function(){ return '<p class="small">Save the date</p><p class="big">Sunday, Oct 25</p><p class="small">2026</p><div class="cd" id="cd"></div>'; },
  function(){ return '<p class="small">Come along at</p><p class="big">10:30 a.m.</p><p class="small"><a href="https://www.google.com/maps/search/?api=1&amp;query=Royal+Court+Madurai" target="_blank" rel="noopener" style="color:inherit">📍 Royal Court, Madurai</a></p><p class="small">Arrive a little early, and save room for cake.</p>'; },
  function(){ return '<p class="small">Boy or girl? Add your name and guess</p><input id="gn" placeholder="Your name" aria-label="Your name" autocomplete="name" value="'+esc(guestName)+'" oninput="guestName=this.value"><div class="row"><button class="pill" aria-pressed="'+(guessVal==='g')+'" onclick="pick(\'g\',this)">👧 A princess</button><button class="pill b" aria-pressed="'+(guessVal==='b')+'" onclick="pick(\'b\',this)">👦 A prince</button></div><p class="small" id="gv">'+gtext()+'</p><button class="go" onclick="sendGuess(this)">Send my guess to the host</button>'; },
  function(){ return '<p class="small">Join us at</p><p class="big">Royal Court</p><p class="small">Madurai · tap below to navigate</p><a class="go" href="https://www.google.com/maps/search/?api=1&amp;query=Royal+Court+Madurai" target="_blank" rel="noopener" onclick="sparkle(this,12)">🧭 Get directions</a><button class="go" style="background:var(--lav)" onclick="venueTap(this)">Copy details</button>'; }
];
function gtext(){ return guessVal==='g' ? 'Noted: a little princess 🎀' : guessVal==='b' ? 'Noted: a little prince 🧸' : ''; }
function tick(){
  var box = $('cd'); if(!box) return;
  var d = target - new Date();
  if(d<=0){ box.innerHTML='<div><b>Today!</b>is the day</div>'; return; }
  var a=[Math.floor(d/864e5),Math.floor(d%864e5/36e5),Math.floor(d%36e5/6e4),Math.floor(d%6e4/1e3)], l=['days','hours','mins','secs'];
  box.innerHTML = a.map(function(v,k){ return '<div><b>'+v+'</b>'+l[k]+'</div>'; }).join('');
}
function show(i, silent){
  var p = $('panel'); p.innerHTML = views[i](); p.classList.remove('swap'); void p.offsetWidth; p.classList.add('swap');
  if(!found[i]){ found[i]=true; document.querySelectorAll('#dots span')[i].classList.add('f');
    if(found.every(Boolean) && !silent) setTimeout(function(){ toast('You found every charm 💖'); sparkle($('panel'),18); },600); }
  clearInterval(cdTimer); if(i===0){ tick(); cdTimer = setInterval(tick,1000); }
}
function hit(i){ note(i); swing(i); show(i); sparkle(document.querySelectorAll('.charm')[i]); }
document.querySelectorAll('.charm').forEach(function(b){ b.addEventListener('click', function(){ hit(+b.dataset.i); }); });

function pick(v, b){ guessVal = v; document.querySelectorAll('.pill').forEach(function(x){ x.setAttribute('aria-pressed', x===b); }); $('gv').textContent = gtext(); sparkle(b,12); }
function esc(t){ return String(t).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function sendGuess(b){
  var name = guestName.trim();
  if(!name){ toast('Please type your name first'); var n=$('gn'); if(n) n.focus(); return; }
  if(!guessVal){ toast('Pick boy or girl first'); return; }
  var msg = 'Hi! This is ' + name + '. My guess for Varsha & Nagendra\'s baby: ' + (guessVal==='g' ? 'a girl 👧' : 'a boy 👦');
  try{ navigator.clipboard.writeText(msg); }catch(e){}
  sparkle(b,16); toast('Opening WhatsApp. Your guess is also copied.');
  window.open('https://wa.me/' + HOST_WHATSAPP + '?text=' + encodeURIComponent(msg), '_blank', 'noopener');
}
function venueTap(b){
  var txt = 'Baby Shower for Varsha & Nagendra\nSunday, Oct 25, 2026 at 10:30 a.m.\nRoyal Court, Madurai';
  sparkle(b,10);
  try{ navigator.clipboard.writeText(txt).then(function(){ toast('Venue and details copied'); }, function(){ toast('Royal Court, Madurai'); }); }
  catch(e){ toast('Royal Court, Madurai'); }
}

// music box: plays a gentle original melody, lighting each charm in turn
var melody = [0,1,2,3,2,1,0,1,2,2,1,1,0,2,3,3,2,1,0,0];
function wind(){
  if(playing) return; playing = true; var w = $('wind'); w.classList.add('playing'); $('windTxt').textContent = 'Playing…';
  var k = 0;
  (function step(){
    if(k >= melody.length){ playing=false; w.classList.remove('playing'); $('windTxt').textContent='Wind it again'; return; }
    var i = melody[k++]; note(i); swing(i); sparkle(document.querySelectorAll('.charm')[i],4);
    setTimeout(step, k%4===0 ? 620 : 380);
  })();
}
function theme(){
  var r=document.documentElement, d = r.getAttribute('data-theme')==='dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme', d?'light':'dark');
}
</script>
</body>
</html>
